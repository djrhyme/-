services:
  web:
    build: .
    container_name: vocab-site-web
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: 0.0.0.0
    # 只监听本机回环，由 Nginx 反向代理对外提供 https
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: vocab-site-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: vocab_site
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d vocab_site']
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  pgdata:
